name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare dataset
        run: python data/download_data.py

      - name: Generate EDA plots
        run: python src/eda.py

      - name: Lint
        run: flake8 data src api tests

      - name: Train and log models
        run: python src/train.py

      - name: Run unit tests
        run: pytest -v tests/

      - name: Validate model artifact
        run: >-
          python -c "import joblib; model = joblib.load('models/heart_disease_model.pkl');
          assert hasattr(model, 'predict') and hasattr(model, 'predict_proba');
          print(type(model).__name__)"

      - name: Build Docker image
        run: docker build --tag heart-disease-api:ci .

      - name: Verify container endpoints
        run: |
          set -euo pipefail
          container_name=heart-disease-api
          docker run --detach --rm --name "$container_name" -p 8000:8000 heart-disease-api:ci
          trap 'docker stop "$container_name" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent --show-error http://localhost:8000/health; then
            docker logs "$container_name"
            exit 1
          fi
          curl --fail --silent --show-error http://localhost:8000/metrics
          curl --fail --header "Content-Type: application/json" \
            --data '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":0,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}' \
            http://localhost:8000/predict
          docker stop heart-disease-api